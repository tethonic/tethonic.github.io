<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tethonic — Decentralized Music Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-orange: #ff6b35;
            --primary-purple: #6366f1;
            --primary-cyan: #06b6d4;
            --dark-bg: #0a0a0a;
            --dark-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Minimal background gradient */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            z-index: 1;
        }        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .logo {
            margin-bottom: 2rem;
            position: relative;
        }        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, var(--primary-orange), var(--primary-purple), var(--primary-cyan));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-orange), var(--primary-purple));
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }        h2 {
            font-weight: 300;
            color: #e0e0e0;
            margin-bottom: 3rem;
            font-size: 1.3rem;
            max-width: 600px;
            line-height: 1.5;
        }

        .highlight {
            color: #ff7b00;
            font-weight: 400;
        }        .coming-soon {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #888;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.9), rgba(255, 123, 0, 0.1));
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 123, 0, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 20px rgba(255, 123, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: pulse 2s infinite;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .coming-soon:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 5px 25px rgba(255, 123, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 123, 0, 0.6);
        }        .music-visualizer {
            display: flex;
            gap: 6px;
            height: 60px;
            margin-bottom: 3rem;
        }

        .bar {
            width: 6px;
            background: linear-gradient(to top, #ff7b00, #ff00d4);
            border-radius: 3px;
            animation: visualize 1.8s ease-in-out infinite;
            transform-origin: bottom;
        }

        .bar:nth-child(1) {
            animation-delay: 0.2s;
        }

        .bar:nth-child(2) {
            animation-delay: 0.6s;
        }

        .bar:nth-child(3) {
            animation-delay: 0.1s;
        }

        .bar:nth-child(4) {
            animation-delay: 0.8s;
        }

        .bar:nth-child(5) {
            animation-delay: 0.4s;
        }

        .bar:nth-child(6) {
            animation-delay: 0.3s;
        }

        .bar:nth-child(7) {
            animation-delay: 0.7s;
        }

        @keyframes visualize {
            0%,
            100% {
                transform: scaleY(0.3);
            }

            50% {
                transform: scaleY(1);
            }
        }        @keyframes pulse {
            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }
        }

        /* Floating musical notes */
        .musical-notes {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .note {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0;
            pointer-events: none;
            animation: floatNote 15s linear infinite;
        }

        .note:nth-child(1) { 
            color: rgba(255, 107, 53, 0.2);
            left: 10%;
            animation-delay: 0s;
        }
        .note:nth-child(2) { 
            color: rgba(99, 102, 241, 0.15);
            left: 25%;
            animation-delay: 3s;
        }
        .note:nth-child(3) { 
            color: rgba(6, 182, 212, 0.2);
            left: 50%;
            animation-delay: 6s;
        }
        .note:nth-child(4) { 
            color: rgba(255, 107, 53, 0.15);
            left: 75%;
            animation-delay: 9s;
        }
        .note:nth-child(5) { 
            color: rgba(99, 102, 241, 0.2);
            left: 90%;
            animation-delay: 12s;
        }

        @keyframes floatNote {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            25% {
                transform: translateY(75vh) rotate(45deg) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translateY(50vh) rotate(90deg) scale(1.1);
                opacity: 0.6;
            }
            75% {
                transform: translateY(25vh) rotate(135deg) scale(0.9);
                opacity: 0.4;
            }
            95% {
                opacity: 0.2;
            }            100% {
                transform: translateY(-5vh) rotate(180deg) scale(0.7);
                opacity: 0;
            }
        }        /* Music Player Styles */
        .music-player {
            margin-top: 3rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .music-player.playing {
            border-color: rgba(255, 107, 53, 0.3);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(255, 107, 53, 0.1);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .play-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .play-button svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .time-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-container {
            width: 100%;
            margin: 0 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-orange), var(--primary-purple));
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .progress-bar:hover .progress-fill {
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }

        .track-info {
            text-align: center;
            margin-bottom: 1rem;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }        .volume-slider {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 107, 53, 0.3);
        }

        .volume-slider::-moz-range-thumb {
            height: 16px;
            width: 16px;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(255, 107, 53, 0.3);
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }        @media (max-width: 768px) {
            h1 {
                font-size: 3.5rem;
                letter-spacing: 5px;
            }

            h2 {
                font-size: 1.1rem;
            }

            .music-visualizer {
                height: 40px;
                gap: 4px;
            }

            .bar {
                width: 4px;
            }

            .music-player {
                margin-top: 2rem;
                padding: 1.5rem;
                max-width: 350px;
            }

            .play-button {
                width: 50px;
                height: 50px;
            }

            .play-button svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="musical-notes">
        <div class="note">♪</div>
        <div class="note">♫</div>
        <div class="note">♩</div>
        <div class="note">♬</div>
        <div class="note">𝄞</div>
    </div>
    
    <div class="container">
        <div class="logo">
            <div class="music-visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <h1>TETHONIC</h1>
        </div>       
         <h2>A decentralized music platform <span class="highlight">empowering artists</span> with freedom and direct
            rewards.
        </h2>
        <div class="coming-soon">Coming Soon</div>
        
        <!-- Music Player -->
        <div class="music-player">
            <div class="track-info">
                <div class="track-title">Tethonic Preview</div>
                <div class="track-artist">Demo Track</div>
            </div>
            
            <div class="player-controls">
                <button class="play-button" id="playButton">
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
            </div>
            
            <div class="time-controls">
                <span id="currentTime">0:00</span>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <span id="duration">0:00</span>
            </div>
            
            <div class="volume-control">
                <svg class="volume-icon" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            </div>
        </div>
        
        <audio id="audioPlayer" preload="metadata">
            <source src="t.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>    <script>        // Audio Player functionality
        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeElement = document.getElementById('currentTime');
        const durationElement = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicPlayer = document.querySelector('.music-player');

        let isPlaying = false;

        // Format time display
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        // Toggle play/pause
        playButton.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
        });        // Update play/pause button state
        audio.addEventListener('play', () => {
            isPlaying = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            musicPlayer.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            musicPlayer.classList.remove('playing');
        });

        // Update progress bar and time
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration;

            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeElement.textContent = formatTime(currentTime);
            }
        });

        // Set duration when metadata loads
        audio.addEventListener('loadedmetadata', () => {
            durationElement.textContent = formatTime(audio.duration);
        });

        // Handle progress bar click
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const progressPercent = clickX / rect.width;
            
            if (audio.duration) {
                audio.currentTime = progressPercent * audio.duration;
            }
        });

        // Handle volume control
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });

        // Set initial volume
        audio.volume = 0.7;

        // Dynamic music visualizer with audio sync
        const bars = document.querySelectorAll('.bar');
        let visualizerInterval;

        function startVisualizer() {
            visualizerInterval = setInterval(() => {
                bars.forEach(bar => {
                    const randomHeight = Math.random() * 0.8 + 0.2;
                    bar.style.transform = `scaleY(${randomHeight})`;
                });
            }, isPlaying ? 100 : 200); // Faster when playing
        }

        function stopVisualizer() {
            clearInterval(visualizerInterval);
            bars.forEach(bar => {
                bar.style.transform = 'scaleY(0.3)';
            });
        }

        // Sync visualizer with audio
        audio.addEventListener('play', () => {
            stopVisualizer();
            startVisualizer();
        });

        audio.addEventListener('pause', () => {
            stopVisualizer();
            startVisualizer();
        });

        // Start initial visualizer
        startVisualizer();

        // Add smooth hover effect to coming soon button
        const comingSoonBtn = document.querySelector('.coming-soon');
        comingSoonBtn.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-2px)';
        });
        
        comingSoonBtn.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });

        // Handle audio loading errors gracefully
        audio.addEventListener('error', (e) => {
            console.log('Audio loading error:', e);
            currentTimeElement.textContent = '0:00';
            durationElement.textContent = '0:00';
        });        // Reset when audio ends
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            progressFill.style.width = '0%';
            currentTimeElement.textContent = '0:00';
            musicPlayer.classList.remove('playing');
        });
    </script>
</body>

</html>
